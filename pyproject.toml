[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "termux-python-dev"
version = "1.0.0"
description = "Python development environment setup for Android/Termux"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "ebroadnax2025-web", email = "ebroadnax2025@gmail.com"}
]
keywords = ["termux", "android", "python", "development", "setup"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Operating System :: Android",
    "Topic :: System :: Installation/Setup",
]

dependencies = [
    "requests>=2.28.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=22.0",
    "flake8>=4.0",
    "mypy>=0.990",
]
data = [
    "pandas>=1.5.0",
    "matplotlib>=3.5.0",
    "scipy>=1.8.0",
]
all = [
    "requests>=2.28.0",
    "numpy>=1.24.0",
    "pandas>=1.5.0",
    "matplotlib>=3.5.0",
    "scipy>=1.8.0",
    "pytest>=7.0",
    "black>=22.0",
    "flake8>=4.0",
]

[project.urls]
Homepage = "https://github.com/ebroadnax2025-web/termux-python-setup"
Documentation = "https://github.com/ebroadnax2025-web/termux-python-setup/wiki"
Repository = "https://github.com/ebroadnax2025-web/termux-python-setup.git"
Issues = "https://github.com/ebroadnax2025-web/termux-python-setup/issues"

[tool.setuptools]
packages = ["termux_python_dev"]

[tool.black]
line-length = 88
target-version = ['py39', 'py310', 'py311']

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
